<body>
    <header>
        <h1>MakanApa 🍲</h1>
        <nav>
            <ul>

                <li><a href="daftar-menu.html">Daftar Menu</a></li>
                <li><a href="tambah-menu.html">Tambah Menu</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Tambah Menu Baru</h2>
        <form action="#" method="POST">
            <p>
                <label for="nama_menu">Nama Makanan / Tempat:</label><br>
                <input type="text" id="nama_menu" name="nama_menu" required>
            </p>
            <p>
                <label for="harga_menu">Harga (Rp):</label><br>
                <input type="number" id="harga_menu" name="harga_menu" placeholder="Contoh: 15000" required>
            </p>
            <button type="submit">Simpan Data</button>
        </form>
    </main>
