<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>MakanApa - Tambah Menu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MakanApa <span class="ikon-emoji">🍲</span></h1>
        <nav>
            <ul>
                <li><a href="halaman_utama.html">Beranda</a></li>
                <li><a href="daftar_menu.html">Daftar Menu</a></li>
                <li><a href="tambah_menu.html">Tambah Menu</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="container">
            <h2>Tambah Menu Baru</h2>
            <form action="#" method="POST">
                <p>
                    <label for="nama_menu">Nama Makanan / Tempat:</label><br>
                    <input type="text" id="nama_menu" name="nama_menu" required>
                </p>
                <p>
                    <label for="harga_menu">Estimasi Harga (Rp):</label><br>
                    <input type="number" id="harga_menu" name="harga_menu" placeholder="Contoh: 15000" required>
                </p>
                <button type="submit">Simpan Data</button>
            </form>
        </div>
    </main>
